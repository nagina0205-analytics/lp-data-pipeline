name: Daily LP data pipeline

on:
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Generate source data and run the pipeline
        run: |
          python src/generate_data.py
          python src/pipeline.py

      - name: Save the latest run report to the repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add output/run_report.md output/*.csv
          git diff --cached --quiet || git commit -m "Update pipeline run report"
          git push
